<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Từ Dẻo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: một cột gọn. Thẻ học bo tròn như bánh mochi là điểm nhấn duy nhất, phần còn lại là các hàng phẳng ngăn bằng đường mảnh. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --sunk:#E1E9E6; --ink:#16302B; --muted:#586C67; --line:#CBD8D3;
  --accent:#C93A63; --on-accent:#FFFFFF; --accent-soft:#F7DCE4;
  --ok:#1F7A55; --ok-soft:#D5EDE2; --bad:#B3342A; --bad-soft:#F6DAD6;
  --h0:var(--sunk);
  --h1:color-mix(in srgb,var(--accent) 24%,var(--sunk));
  --h2:color-mix(in srgb,var(--accent) 46%,var(--sunk));
  --h3:color-mix(in srgb,var(--accent) 72%,var(--sunk));
  --h4:var(--accent);
  --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ipa:'Noto Sans','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111917; --surface:#19231F; --sunk:#223029; --ink:#E4EFEB; --muted:#9BB0A9; --line:#2D3E38;
  --accent:#F27A9C; --on-accent:#2B0D18; --accent-soft:#43202D;
  --ok:#5FD0A0; --ok-soft:#1B3A2D; --bad:#F28B82; --bad-soft:#46231F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#19231F; --sunk:#223029; --ink:#E4EFEB; --muted:#9BB0A9; --line:#2D3E38;
  --accent:#F27A9C; --on-accent:#2B0D18; --accent-soft:#43202D;
  --ok:#5FD0A0; --ok-soft:#1B3A2D; --bad:#F28B82; --bad-soft:#46231F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.in-session{padding-bottom:32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.ipa{font-family:var(--ipa);color:var(--muted);font-size:.95em}

/* top bar */
.top{display:flex;align-items:center;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin-right:auto}
.mark{width:30px;height:25px;background:var(--accent);border-radius:52% 48% 46% 54%/62% 60% 40% 38%;position:relative;flex:none}
.mark::after{content:"";position:absolute;left:8px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--on-accent);box-shadow:9px 0 0 var(--on-accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:4px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:12px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
body.in-session .tabs{display:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud::before{background:var(--ok)} .sync.err::before{background:var(--bad)}
@media (min-width:760px){
  body{padding-bottom:48px}
  .top{flex-wrap:nowrap}
  .tabs{position:static;border:0;background:none;padding:0;gap:4px}
  .tabs button{flex:none;padding:8px 16px;font-size:14px}
  .top .brand{margin-right:0;order:0}
  .tabs{order:1;margin-left:12px}
  .top .grow{flex:1;order:2}
  .sync{order:3}
  .iconbtn{order:4}
}
@media (max-width:559px){.sync{font-size:0;gap:0}}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 18px;font-weight:600;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.lg{padding:14px 28px;font-size:17px;border-radius:999px;font-family:var(--display);font-weight:700}
.btn.quiet{background:none}
.btn.small{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* today */
.hero{display:flex;flex-direction:column;gap:12px;padding:8px 0 4px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(30px,6vw,44px);font-weight:800}
.hero h1 .big{color:var(--accent);font-size:1.5em}
.week{display:flex;gap:8px}
.week span{flex:1;max-width:48px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.week i{width:100%;aspect-ratio:1;border-radius:50%;background:var(--h0);display:block}
.week .on i{background:var(--accent)}
.week .now i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}
.trio>div{padding:14px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.trio>div+div{border-left:1px solid var(--line);padding-left:16px}
.trio b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.s-learning{background:var(--h2);color:var(--ink)} .chip.s-young{background:var(--h3);color:var(--on-accent)} .chip.s-mastered{background:var(--h4);color:var(--on-accent)}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* segmented progress */
.seg{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.seg i{display:block;height:100%;min-width:0}
.seg .a{background:var(--h2)} .seg .b{background:var(--h3)} .seg .c{background:var(--h4)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--sunk);border:1px solid var(--line)}
.legend .a i{background:var(--h2);border-color:var(--h2)} .legend .b i{background:var(--h3);border-color:var(--h3)} .legend .c i{background:var(--h4);border-color:var(--h4)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* topics */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.topic h3{font-size:20px;font-weight:700}
.topic .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}

/* word rows */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.wmain{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 2px}
.wmain .w{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.2}
.wmain .w small{display:block;font-family:var(--ipa);font-weight:400;font-size:12.5px;color:var(--muted)}
.wmain .vi{font-size:14px;color:var(--ink)}
.wdet{padding:0 2px 14px;display:flex;flex-direction:column;gap:10px}
.wdet mark,.ex mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
@media (max-width:560px){.wmain{grid-template-columns:minmax(0,1fr) auto}.wmain .vi{grid-column:1/2;grid-row:2}}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input,.tools select,.field input,.field select,.field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tools input{flex:1 1 200px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
textarea{resize:vertical;min-height:110px;width:100%}

/* session */
.sess{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.sbar{display:flex;align-items:center;gap:12px}
.x{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--muted);flex:none}
.prog{flex:1;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;
  box-shadow:inset 0 -10px 0 var(--sunk),0 1px 0 var(--line)}
.card .big{font-family:var(--display);font-weight:800;font-size:clamp(38px,9vw,56px);line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .vi-big{font-size:clamp(20px,4.5vw,26px);font-weight:600;line-height:1.35}
.card .prompt{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.card .ex{font-size:16px;color:var(--ink);max-width:46ch;text-wrap:pretty}
.card .ex.blank{font-size:18px}
.speak{border:1.5px solid var(--line);background:var(--surface);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;color:var(--accent);flex:none}
.speak.lg{width:72px;height:72px}
.speak svg{width:55%;height:55%}
.speak[disabled]{opacity:.4}
.ic{display:block;font-size:64px;line-height:1.1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ic.md{display:inline;font-size:26px}
.ic.sm{display:inline;font-size:20px;margin-right:8px;vertical-align:-2px}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{position:relative;display:grid;place-items:center;padding:16px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);transition:transform .08s ease}
.pic:active{transform:scale(.97)}
.pic .emo{font-size:52px;line-height:1.1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.pic .k{position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:7px;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center}
.pic.ok{background:var(--ok-soft);border-color:var(--ok)} .pic.bad{background:var(--bad-soft);border-color:var(--bad)}
.pic[disabled]{cursor:default}
.dline{font-size:18px;line-height:1.6}
.dw.ok{color:var(--ok);font-weight:600}
.dw.miss{color:var(--bad);font-weight:600;text-decoration:underline wavy;text-underline-offset:4px}
.spk{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.speak.slow{width:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:0 14px 0 10px;font-size:13px;font-weight:700;color:var(--ink)}
.speak.slow svg{width:20px;height:20px;color:var(--accent)}
.speak.lg.slow{height:56px;font-size:15px}
.exv{font-size:14px;color:var(--muted);text-wrap:pretty;max-width:46ch}
.fb .exv{color:var(--ink);opacity:.75}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 18px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lvrow{display:flex;gap:12px;align-items:center}
.lvn{font-family:var(--display);font-weight:800;width:28px;font-size:18px}
.lvc{font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;transition:transform .08s ease}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:700;display:grid;place-items:center}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)} .opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.ans{width:100%;text-align:center;font-family:var(--display);font-size:28px;font-weight:700;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--bg)}
.ans:focus{border-color:var(--accent);outline:none}
.pat{font-family:var(--ipa);letter-spacing:.18em;color:var(--muted);font-size:18px;white-space:pre-wrap}
.fb{border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb strong{font-family:var(--display);font-size:20px}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.fb .wd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb .wd b{font-family:var(--display);font-size:22px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px 4px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.grades small{font-weight:500;color:var(--muted);font-size:11.5px}
.summary{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0}
.summary .big{font-family:var(--display);font-size:64px;font-weight:800;color:var(--accent);line-height:1}

/* stats */
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:4px;background:var(--h0)}
.heat .l1{background:var(--h1)} .heat .l2{background:var(--h2)} .heat .l3{background:var(--h3)} .heat .l4{background:var(--h4)} .heat .f{opacity:.35}
.ramp{display:inline-flex;gap:3px;align-items:center}
.ramp i{width:12px;height:12px;border-radius:3px;display:inline-block}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.fc>div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.fc .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.fc .b{width:100%;max-width:44px;background:var(--h3);border-radius:6px 6px 2px 2px;min-height:3px}
.fc .d{font-size:11.5px;color:var(--muted)}
.fc .today .b{background:var(--accent)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,18,16,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:760px){.veil{align-items:center}.sheet{border-radius:24px}}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:90%}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="root">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Từ Dẻo</div>
    <div class="grow"></div>
    <nav class="tabs" id="tabs" aria-label="Điều hướng">
      <button data-a="tab" data-t="today">Hôm nay</button>
      <button data-a="tab" data-t="topics">Chủ đề</button>
      <button data-a="tab" data-t="words">Từ vựng</button>
      <button data-a="tab" data-t="stats">Tiến độ</button>
    </nav>
    <span class="sync" id="sync"></span>
    <button class="iconbtn" data-a="sheet" data-s="settings">Cài đặt</button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
const TOPICS_A = [
{id:"a1-basics",lv:"A1",name:"Greetings & Basics",vi:"Chào hỏi và từ cơ bản",words:[
["hello","/həˈloʊ/","exclam","xin chào","Hello, my name is Linh.","Xin chào, tên mình là Linh."],
["goodbye","/ɡʊdˈbaɪ/","exclam","tạm biệt","Goodbye! See you tomorrow.","Tạm biệt! Hẹn gặp bạn ngày mai."],
["please","/pliːz/","adv","làm ơn, xin vui lòng","Please sit down.","Xin mời ngồi."],
["thank you","/ˈθæŋk juː/","phr","cảm ơn","Thank you for your help.","Cảm ơn bạn đã giúp đỡ."],

["excuse me","/ɪkˈskjuːz miː/","phr","xin lỗi (khi hỏi hoặc nhờ ai)","Excuse me, where is the bus stop?","Xin lỗi, trạm xe buýt ở đâu ạ?"],
["yes","/jes/","adv","vâng, có, đúng","Yes, I like coffee.","Vâng, tôi thích cà phê."],
["no","/noʊ/","adv","không","No, thank you.","Không, cảm ơn."],
["name","/neɪm/","n","tên","What is your name?","Bạn tên là gì?"],
["friend","/frend/","n","bạn bè","She is my best friend.","Cô ấy là bạn thân nhất của tôi."],
["welcome","/ˈwelkəm/","exclam","chào mừng","Welcome to my house.","Chào mừng đến nhà tôi."],

<script>
(function(){

var KEY='tu-deo.v1',DAY=864e5;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'')};
var slug=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* ---------- dates ---------- */
function todayNum(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/DAY)}
function dstr(n){return new Date(n*DAY).toISOString().slice(0,10)}
function dowOf(n){return (new Date(n*DAY).getUTCDay()+6)%7}

/* ---------- state ---------- */
function defaults(){return{v:1,u:0,lv:'A1',set:{newPerDay:10,accent:'en-US',auto:true,slow:0.55},cards:{},custom:[],hist:{},active:['a1-basics','a1-family'],star:{}}}
function migrate(o){var d=defaults();o=o||{};var s=Object.assign({},d,o);s.set=Object.assign({},d.set,o.set||{});s.cards=o.cards||{};s.custom=o.custom||[];s.hist=o.hist||{};s.active=Array.isArray(o.active)?o.active:d.active.slice();s.star=o.star||{};if(!o.lv){s.lv='A1';if(s.active.join()==='daily,food')s.active=d.active.slice()}return s}
function load(){try{var r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return defaults()}
var S=load();
var SYNC='local',DOC=null,dbBusy=false,dbDirty=false,dbTimer=null;
function persist(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(dbTimer);if(DOC)dbTimer=setTimeout(pushDb,1500)}
function setSync(s){SYNC=s;var el=$('#sync');if(!el)return;el.className='sync'+(s==='cloud'?' cloud':s==='err'?' err':'');var m=s==='cloud'?'Đã đồng bộ':s==='err'?'Lỗi đồng bộ':'Lưu trên máy này';el.textContent=m;el.title=m}
function pushDb(){
  if(!DOC)return;if(dbBusy){dbDirty=true;return}
  dbBusy=true;
  DOC.set({u:S.u,json:JSON.stringify(S)}).then(function(){setSync('cloud')},function(){setSync('err')}).then(function(){dbBusy=false;if(dbDirty){dbDirty=false;pushDb()}});
}
function initDb(){
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user){setSync('local');return}
      return user.id().then(function(id){
        if(!id){setSync('local');return}
        DOC=db.doc('data/users/'+id+'/profile');
        return DOC.get().then(function(snap){
          if(snap.exists){
            var d=snap.data();
            if(d&&d.json){
              var remote=migrate(JSON.parse(d.json));
              if((remote.u||0)>(S.u||0)&&!SESS){S=remote;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}buildWords();render()}
              else if((S.u||0)>(remote.u||0))pushDb();
            }
          }else if(S.u){pushDb()}
          setSync('cloud');
        });
      });
    }).catch(function(){setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- words ---------- */
var WORDS=[],BYID={};
function allTopics(){return TOPICS.concat([{id:'mine',name:'My Words',vi:'Từ của tôi',words:[]}])}
function topicById(id){return allTopics().filter(function(t){return t.id===id})[0]}
function buildWords(){
  WORDS=[];BYID={};
  TOPICS.forEach(function(t){t.words.forEach(function(w){var o={id:t.id+'.'+slug(w[0]),t:t.id,w:w[0],ipa:w[1],pos:w[2],vi:w[3],ex:w[4],exv:w[5]||'',ic:w[6]||''};WORDS.push(o);BYID[o.id]=o})});
  S.custom.forEach(function(c){var o={id:c.id,t:c.t||'mine',w:c.w,ipa:c.ipa||'',pos:c.pos||'',vi:c.vi,ex:c.ex||'',exv:'',ic:'',custom:true};WORDS.push(o);BYID[o.id]=o});
}
buildWords();
var TLV={};TOPICS.forEach(function(t){TLV[t.id]=t.lv});
function topicsOfLevel(l){return TOPICS.filter(function(t){return t.lv===l})}
function planTopicIds(){
  var has=function(id){return WORDS.some(function(w){return w.t===id&&!S.cards[w.id]})};
  var a=S.active.filter(has);if(a.length)return a;
  var ids=LEVELS.map(function(l){return l.id}),i=Math.max(0,ids.indexOf(S.lv));
  var order=TOPICS.filter(function(t){return ids.indexOf(t.lv)>=i}).concat(TOPICS.filter(function(t){return ids.indexOf(t.lv)<i}));
  for(var k=0;k<order.length;k++)if(has(order[k].id))return [order[k].id];
  return [];
}
function wordRe(w){return new RegExp('(^|[^A-Za-z])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z])','i')}
function hl(ex,word){if(!ex)return '';var m=wordRe(word).exec(ex);if(!m)return esc(ex);var s=m.index+m[1].length,e=s+m[2].length;return esc(ex.slice(0,s))+'<mark>'+esc(ex.slice(s,e))+'</mark>'+esc(ex.slice(e))}
function clozeOf(w){if(!w.ex)return null;var re=wordRe(w.w);if(!re.test(w.ex))return null;return w.ex.replace(re,function(m,a){return a+'_____'})}

/* ---------- scheduling (SM-2) ---------- */
function newCard(){return{ef:2.5,iv:0,rp:0,lp:0,due:0,n:0}}
function sm2(c,q){
  var ef=c.ef,iv=c.iv,rp=c.rp,lp=c.lp;
  if(q<3){rp=0;iv=1;lp+=1;ef=Math.max(1.3,ef-0.2)}
  else{
    rp+=1;
    if(rp===1)iv=1;else if(rp===2)iv=3;else iv=Math.max(c.iv+1,Math.round(c.iv*ef*(q===3?0.85:q===5?1.15:1)));
    ef=Math.max(1.3,ef+0.1-(5-q)*(0.08+(5-q)*0.02));
  }
  return Object.assign({},c,{ef:Math.round(ef*1000)/1000,iv:iv,rp:rp,lp:lp});
}
function stageOf(id){var c=S.cards[id];if(!c)return 'new';return c.iv<7?'learning':c.iv<21?'young':'mastered'}
var STAGE_VI={'new':'Chưa học',learning:'Đang học',young:'Khá nhớ',mastered:'Đã thuộc'};
function fmtIv(d){return d<30?d+' ngày':d<365?Math.round(d/30)+' tháng':(Math.round(d/36.5)/10)+' năm'}
function histGet(n){return S.hist[dstr(n)]}
function histMake(n){var k=dstr(n);return S.hist[k]||(S.hist[k]={n:0,r:0,c:0})}
function dueIds(topic){var t=todayNum();return Object.keys(S.cards).filter(function(id){return BYID[id]&&S.cards[id].due<=t&&(!topic||BYID[id].t===topic)})}
function leechIds(){return Object.keys(S.cards).filter(function(id){var c=S.cards[id];return BYID[id]&&(c.lp>=2||c.ef<1.9)})}
function unseen(topics){var out=[];topics.forEach(function(t){WORDS.forEach(function(w){if(w.t===t&&!S.cards[w.id])out.push(w)})});return out}
function newQuota(){var h=histGet(todayNum());return Math.max(0,S.set.newPerDay-(h?h.n:0))}
function streakNow(){var d=todayNum();function has(n){var h=histGet(n);return h&&(h.r>0||h.n>0)}if(!has(d))d--;var s=0;while(has(d)){s++;d--}return s}
function streakBest(){var ks=Object.keys(S.hist).filter(function(k){var h=S.hist[k];return h.r>0||h.n>0}).sort();var best=0,cur=0,prev=null;ks.forEach(function(k){var n=Math.round(Date.parse(k+'T00:00:00Z')/DAY);cur=(prev!==null&&n===prev+1)?cur+1:1;prev=n;if(cur>best)best=cur});return best}

/* ---------- speech ---------- */
var hasTTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),voices=[];
if(hasTTS){try{voices=speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',function(){voices=speechSynthesis.getVoices()})}catch(e){}}
function speak(text,rate){
  if(!hasTTS)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=S.set.accent;u.rate=rate||0.95;
    var v=voices.filter(function(v){return v.lang.replace('_','-')===S.set.accent})[0]||voices.filter(function(v){return v.lang.indexOf('en')===0})[0];
    if(v)u.voice=v;speechSynthesis.speak(u);
  }catch(e){}
}

function pickType(id,phase){
  var w=BYID[id],c=S.cards[id],cl=!!clozeOf(w),pic=!!w.ic;
  if(phase==='new1'||phase==='relearn'){var p0=['choice','choiceRev'];if(pic)p0.push('picWord','picWord');return pick(p0)}
  if(phase==='new2'){var o=['type'];if(cl)o.push('cloze');if(hasTTS)o.push('listen');return pick(o)}
  var iv=c?c.iv:0,p;
  if(iv<4){p=['choice','choiceRev'];if(hasTTS)p.push('listen');if(pic){p.push('picWord');if(hasTTS)p.push('picListen')}}
  else if(iv<14){p=['type','choiceRev','flip'];if(cl)p.push('cloze');if(pic&&hasTTS)p.push('picListen')}
  else{p=['type','flip'];if(cl)p.push('cloze')}
  return pick(p);
}
function startDict(topic){
  if(!hasTTS){toast('Trình duyệt này không hỗ trợ giọng đọc nên chưa luyện nghe chép được');return}
  var ids=LEVELS.map(function(l){return l.id}),maxLv=Math.max(0,ids.indexOf(S.lv));
  var learned=Object.keys(S.cards).map(function(id){return BYID[id]}).filter(function(w){return w&&w.ex&&(!topic||w.t===topic)});
  var easy=learned.filter(function(w){return ids.indexOf(TLV[w.t])<=maxLv});
  var pool=easy.length>=5?easy:learned;
  if(pool.length<6){var pt=topic?[topic]:planTopicIds();pool=pool.concat(WORDS.filter(function(w){return w.ex&&!S.cards[w.id]&&pt.indexOf(w.t)>=0}))}
  pool=shuffle(pool).slice(0,8);
  if(!pool.length){toast('Chưa có câu nào để luyện');return}
  SESS={mode:'dict',queue:pool.map(function(w){return{id:w.id,type:'dictate',phase:'dict'}}),cur:null,ui:null,done:{},doneN:0,wrong:{},stats:{ans:0,ok:0,fresh:0,rev:0},total:pool.length,finished:false,speak:false};
  nextTask();render();
}
function startSession(mode,topic){
  if(mode==='dict'){startDict(topic);return}
  var q=[],today=todayNum(),dueL=[],newL=[];
  if(mode==='hard'){dueL=leechIds()}
  else if(mode==='extra'){newL=unseen(planTopicIds()).slice(0,5)}
  else if(mode==='topic'){dueL=dueIds(topic);newL=unseen([topic]).slice(0,S.set.newPerDay)}
  else{dueL=dueIds();newL=unseen(planTopicIds()).slice(0,newQuota())}
  dueL=shuffle(dueL).slice(0,30);
  if(!dueL.length&&!newL.length){toast('Chưa có từ nào để học lúc này');return}
  SESS={mode:mode,queue:[],cur:null,ui:null,done:{},doneN:0,wrong:{},stats:{ans:0,ok:0,fresh:0,rev:0},total:dueL.length+newL.length,finished:false,speak:false};
  dueL.forEach(function(id){SESS.queue.push({id:id,type:pickType(id,'rev'),phase:'rev'})});
  newL.forEach(function(w){SESS.queue.push({id:w.id,type:'intro',phase:'intro'})});
  nextTask();render();
}
function insertTask(t,off){SESS.queue.splice(Math.min(off,SESS.queue.length),0,t)}
function makeOpts(id,kind){
  if(kind==='ic'){
    var tw=BYID[id],others=shuffle(WORDS.filter(function(x){return x.ic&&x.id!==id&&x.ic!==tw.ic}));
    var diff=others.filter(function(x){return x.t!==tw.t}),same=others.filter(function(x){return x.t===tw.t}),seenI={},outI=[];
    seenI[tw.ic]=1;
    diff.concat(same).some(function(x){if(seenI[x.ic])return false;seenI[x.ic]=1;outI.push(x);return outI.length===3});
    return shuffle([tw].concat(outI)).map(function(x){return{id:x.id,text:x.ic,ok:x.id===id}});
  }
  var w=BYID[id],seen={},out=[];seen[kind==='vi'?w.vi:norm(w.w)]=1;

  }else if(t.phase==='new2'){
    if(ok){
      var c0=sm2(newCard(),(SESS.wrong[id]||o.hint)?3:4);c0.due=today+c0.iv;c0.n=1;S.cards[id]=c0;h.n++;SESS.stats.fresh++;markDone(id);
    }else{SESS.wrong[id]=1;insertTask({id:id,type:pickType(id,'new1'),phase:'new1'},2)}

}

function dictCompare(ex,typed){
  var tt=toks(ex).map(tkey),uu=toks(typed).map(tkey),n=tt.length,m=uu.length,dp=[],i,j;
  for(i=0;i<=n;i++)dp.push(new Array(m+1).fill(0));
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=tt[i-1]===uu[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  var marks=new Array(n).fill(false);i=n;j=m;
  while(i>0&&j>0){if(tt[i-1]===uu[j-1]){marks[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  var hit=marks.filter(Boolean).length;
  return{marks:marks,hit:hit,total:n,score:n?hit/n:0,ok:n>0&&hit===n};
}

function act(a,b){
  var d=(b&&b.dataset)||{};

    case 'tab':V.tab=d.t;V.topic=null;V.confirm=null;window.scrollTo(0,0);render();break;
    case 'openTopic':V.tab='topics';V.topic=d.id;W.open=null;window.scrollTo(0,0);render();break;
    case 'back':V.topic=null;render();break;
    case 'lvf':V.lvf=d.l;render();break;
    case 'toggleActive':var i=S.active.indexOf(d.id);if(i>=0)S.active.splice(i,1);else S.active.push(d.id);persist();render();break;
    case 'expand':W.open=(W.open===d.id)?null:d.id;if(V.tab==='words')renderWordList();else render();break;
    case 'speak':{var sw=BYID[d.id];if(sw)speak(d.x?(sw.ex||sw.w):sw.w,d.r==='slow'?S.set.slow:0.95);break}
    case 'star':if(S.star[d.id])delete S.star[d.id];else S.star[d.id]=1;persist();if(V.tab==='words')renderWordList();else render();break;
    case 'startDaily':startSession('daily');break;
    case 'startExtra':SESS=null;startSession('extra');break;
    case 'startHard':startSession('hard');break;
    case 'startDict':startSession('dict',d.id||null);break;
    case 'startTopic':startSession('topic',d.id);break;
    case 'sheet':V.sheet=d.s;V.editId=d.id||null;V.confirm=null;renderSheet();break;
    case 'sheetClose':readSettings();V.sheet=null;V.confirm=null;renderSheet();if(V.tab==='words'||V.tab==='topics')render();break;
    case 'veil':break;
    case 'copyBk':var ta=$('#bk');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Đã sao chép')},function(){toast('Hãy nhấn giữ để sao chép phần đã chọn')})}catch(e){toast('Hãy nhấn giữ để sao chép phần đã chọn')}break;
    case 'restore':
      if(V.confirm!=='restore'){V.confirm='restore';var rv=$('#bk-in').value;V.pending=rv;renderSheet();$('#bk-in').value=rv;break}
      try{var o=JSON.parse($('#bk-in').value);if(!o||typeof o!=='object'||!o.cards)throw 0;S=migrate(o);persist();buildWords();V.sheet=null;V.confirm=null;renderSheet();render();toast('Đã khôi phục tiến độ')}catch(e){V.confirm=null;renderSheet();toast('Bản sao lưu không hợp lệ')}
      break;
    case 'resetAll':
      if(V.confirm!=='reset'){V.confirm='reset';renderSheet();break}
      S=defaults();persist();buildWords();V.sheet=null;V.confirm=null;renderSheet();render();toast('Đã xóa toàn bộ tiến độ');break;
    case 'saveWord':{
      var w=$('#f-w').value.trim(),vi=$('#f-vi').value.trim();
      if(!w||!vi){toast('Cần nhập từ và nghĩa');break}
      var rec={w:w,vi:vi,ex:$('#f-ex').value.trim(),ipa:$('#f-ipa').value.trim(),pos:$('#f-pos').value.trim(),t:$('#f-t').value};
      if(V.sheet==='edit'&&V.editId){var c=S.custom.filter(function(x){return x.id===V.editId})[0];if(c)Object.assign(c,rec)}
      else{rec.id='c'+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36);S.custom.push(rec)}
      persist();buildWords();V.sheet=null;renderSheet();render();toast('Đã lưu từ');break}
    case 'doImport':{
      var lines=$('#imp').value.split('\n'),add=0;
      lines.forEach(function(l){var p=l.split(/\s*\|\s*|\t/);if(p.length<2||!p[0].trim()||!p[1].trim())return;S.custom.push({id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),w:p[0].trim(),vi:p[1].trim(),ex:(p[2]||'').trim(),ipa:'',pos:'',t:'mine'});add++});
      if(!add){toast('Chưa có dòng nào đúng định dạng');break}
      persist();buildWords();V.sheet=null;renderSheet();render();toast('Đã nhập '+add+' từ');break}
    case 'delWord':
      if(V.confirm!=='del:'+d.id){V.confirm='del:'+d.id;if(V.tab==='words')renderWordList();else render();break}
      S.custom=S.custom.filter(function(x){return x.id!==d.id});delete S.cards[d.id];delete S.star[d.id];V.confirm=null;persist();buildWords();render();break;
    /* session */
    case 'sExit':SESS=null;render();break;
    case 'sDone':SESS=null;V.tab='today';render();break;
    case 'sGot':{var t=SESS.cur;insertTask({id:t.id,type:pickType(t.id,'new1'),phase:'new1'},3);nextTask();render();break}
    case 'sNext':nextTask();render();break;
    case 'sShow':SESS.ui.shown=true;render();break;
    case 'sGrade':{var q=+d.q;answer(q>1,{q:q});nextTask();render();break}
    case 'sOpt':{
      var u=SESS.ui;if(u.fb)break;var o=u.opts[+d.i];if(!o)break;
      u.chosen=+d.i;u.fb={ok:o.ok};answer(o.ok);render();break}
    case 'sCheck':{
      var u2=SESS.ui;if(u2.fb)break;var inp=$('#ans');if(!inp||!inp.value.trim()){if(inp)inp.focus();break}
      if(SESS.cur.type==='dictate'){var dc=dictCompare(BYID[SESS.cur.id].ex,inp.value);u2.fb={ok:dc.ok,score:dc.score,hit:dc.hit,total:dc.total,marks:dc.marks,typed:inp.value.trim()};answer(dc.ok,{score:dc.score,hint:u2.hint});render();break}
      var ok=norm(inp.value)===norm(BYID[SESS.cur.id].w);u2.fb={ok:ok};answer(ok,{hint:u2.hint});render();break}
    case 'sHint':{var inp2=$('#ans'),keep=inp2?inp2.value:'';SESS.ui.hint=true;render();var i2=$('#ans');if(i2){i2.value=keep;i2.focus()}break}
    case 'sSkip':{var u3=SESS.ui;if(u3.fb)break;u3.fb={ok:false};answer(false);render();break}
  }
}
document.addEventListener('click',function(e){
  var v=e.target.closest('.veil');
  if(v&&!e.target.closest('.sheet')){act('sheetClose');return}
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b);
});
document.addEventListener('input',function(e){
  if(e.target.id==='wq'){W.q=e.target.value;renderWordList()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='wt'){W.t=e.target.value;renderWordList()}
  else if(e.target.id==='ws'){W.s=e.target.value;renderWordList()}
  else if(e.target.id&&e.target.id.indexOf('set-')===0)readSettings();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&V.sheet){act('sheetClose');return}
  if(!SESS||SESS.finished||V.sheet)return;
  var tag=(document.activeElement&&document.activeElement.tagName)||'',t=SESS.cur,u=SESS.ui;
  if(e.key==='Enter'){
    if(tag==='BUTTON')return;
    e.preventDefault();
    if(u.fb)act('sNext');else if(t.type==='intro')act('sGot');else if(t.type==='flip'&&!u.shown)act('sShow');else if(t.type==='type'||t.type==='cloze'||t.type==='dictate')act('sCheck');
    return;
  }
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(/^[1-4]$/.test(e.key)){
    var i=+e.key-1;
    if(u.opts&&!u.fb&&u.opts[i])act('sOpt',{dataset:{i:i}});
    else if(t.type==='flip'&&u.shown)act('sGrade',{dataset:{q:[1,3,4,5][i]}});
  }else if(e.key===' '&&t.type==='flip'&&!u.shown){e.preventDefault();act('sShow')}
  else if(e.key==='s'||e.key==='S')speak(audioOf(t));
  else if(e.key==='d'||e.key==='D')speak(audioOf(t),S.set.slow);
});

setSync('local');render();initDb();
})();
</script>

</body></html>
